# The name of each language in the language switch is its `label` in the site config

menu:
  home: 首页
  archives: 归档
  tags: 标签
  categories: 分类
  links: 链接
  about: 关于
  rss: RSS

footer:
  powered: "由 {{ .links }} 强力驱动"
  theme: 主题

posts:
  prev: 上一页
  next: 下一页
  prev_post: 上一篇
  next_post: 下一篇

copyright:
  license: "本文采用 {{ .license }} 许可协议，转载请注明出处。"
  link: 本文地址：

comments:
  load: "加载 {{ .name }} 评论"

# Hugo has no month names for the zh-CN locale, so the date formats spell the month out.
# These are the formats Moment.js gave "MMM DD YYYY" and "MMM DD" on the Hexo site.
date:
  long: "{{ .Month }}月 {{ .Day }} {{ .Year }}"
  short: "{{ .Month }}月 {{ .Day }}"
