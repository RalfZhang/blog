# ===========================================
# Site Information Settings
# ===========================================

# Site creation time
since: 2017

# Custom your favicon.ico in `site/source`
favicon: /favicon.ico

# Set feed link (false | default | your feed link)
# false: disable
# default: use `atom.xml`, generator for `hexo-generator-feed`
rss: default

# ===========================================
# Menu Settings
# ===========================================
menu:
  Archives: /archives
  About: /about
  Links: /links
  RSS: /atom.xml

# ===========================================
# Widget Settings
# ===========================================
# widget function
# false: disable
# widget_custom: custom your widget
#   title: your widget title
#   content: Add your html code in here. Example: <p>testing...</p>
widget:
  Tags: true
  Categories: false
  Custom: false

widget_custom:
    title: Test
    content: <p>testing...</p>

# ===========================================
# Theme Settings
# ===========================================
# theme styling
# color: Default | Mint Green | Cobalt Blue | Hot Pink | Dark Violet
theme:
  color: Default
  fancybox: false


# ===========================================
# Copyright Settings
# ===========================================
copyright: true

# ===========================================
# Third Party Services Settings
# ===========================================

# Baidu Analytics
baidu_analytics: f9a64e560366e81efee97a73f25847bc
# Google Analytics
google_analytics: UA-113221956-1

# Duoshuo
duoshuo_shortname:
# Disqus
disqus_shortname: ralfzblog


# ===========================================
# Version
# ===========================================
version: 1.0
