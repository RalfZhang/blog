# Theme defaults. The site's hugo.yaml overrides any of these under `params`.
# Menus go in the site config (menus.main). Menu names are translated through menu.<identifier> in i18n/. An
# entry's pageRef that has no page in the current language links to the default language's page, and its
# params.output_format links to that output of the page instead (output_format: atom on the home page gives the
# language's feed). Disqus and Google Analytics are read from Hugo's `services` config.

params:
  # ===========================================
  # Site Information Settings
  # ===========================================

  # Site creation time
  since:

  # Custom your favicon.ico in `site/static`
  favicon: /favicon.ico

  # The language whose version of a translated page is its hreflang="x-default" alternate (for readers of
  # none of the site's languages). Empty: the default content language.
  hreflang_x_default:

  # ===========================================
  # Widget Settings
  # ===========================================
  # widget function
  # false: disable
  # widget_custom: custom your widget
  #   title: your widget title
  #   content: Add your html code in here. Example: <p>testing...</p>
  widget:
    tags: true
    custom: false

  widget_custom:
    title: Test
    content: <p>testing...</p>

  # ===========================================
  # Theme Settings
  # ===========================================
  # theme styling
  # color: Default | Mint Green | Cobalt Blue | Hot Pink | Dark Violet
  theme:
    color: Default
    fancybox: false

  # ===========================================
  # Copyright Settings
  # ===========================================
  copyright: true

  # ===========================================
  # Third Party Services Settings
  # ===========================================

  # Baidu Analytics
  baidu_analytics:

  # ===========================================
  # Version
  # ===========================================
  version: 1.0
