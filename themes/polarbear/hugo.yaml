# Theme defaults. The site's hugo.yaml overrides any of these under `params`.
# Menus go in the site config (languages.<lang>.menus.main); menu names are translated through menu.<identifier>
# in i18n/. Disqus and Google Analytics are read from Hugo's `services` config.

params:
  # ===========================================
  # Site Information Settings
  # ===========================================

  # Site creation time
  since:

  # Custom your favicon.ico in `site/static`
  favicon: /favicon.ico

  # ===========================================
  # Widget Settings
  # ===========================================
  # widget function
  # false: disable
  # widget_custom: custom your widget
  #   title: your widget title
  #   content: Add your html code in here. Example: <p>testing...</p>
  widget:
    tags: true
    custom: false

  widget_custom:
    title: Test
    content: <p>testing...</p>

  # ===========================================
  # Theme Settings
  # ===========================================
  # theme styling
  # color: Default | Mint Green | Cobalt Blue | Hot Pink | Dark Violet
  theme:
    color: Default
    fancybox: false

  # ===========================================
  # Copyright Settings
  # ===========================================
  copyright: true

  # ===========================================
  # Third Party Services Settings
  # ===========================================

  # Baidu Analytics
  baidu_analytics:

  # ===========================================
  # Version
  # ===========================================
  version: 1.0
