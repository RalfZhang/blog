{{ define "title" }}{{ .Title }} - {{ site.Title }}{{ end }}

{{ define "main" }}
    <div id="primary">
        {{ if eq .Section "posts" }}
            {{ partial "post.html" (dict "post" . "isHome" false) }}
        {{ else }}
            <article class="post">
                <header class="post-header">
                    <h1 class="post-title">
                        {{ .Title }}
                    </h1>
                </header>
                <div class="post-content">
                    {{ .Content }}
                </div>
            </article>
        {{ end }}
    </div>
{{ end }}
